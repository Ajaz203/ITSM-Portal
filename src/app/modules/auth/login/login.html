<div class="login-wrapper">

  <!-- LEFT -->

  <div class="login-left">

    <div class="overlay"></div>

    <div class="content">

      <h1>
        Enterprise ITSM Portal
      </h1>

      <p>
        Manage incidents, changes, assets, SLA tracking,
        audit logs and enterprise workflows efficiently.
      </p>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="login-right">

    <div class="login-card">

      <div class="logo">
        ITSM
      </div>

      <h2>
        Welcome Back 👋
      </h2>

      <p class="subtitle">
        Login to continue
      </p>

      <form [formGroup]="loginForm">

  <div class="form-group">

    <label>Email Address</label>

    <input
      type="email"
      class="form-control"
      placeholder="Enter email"
      formControlName="email"
    />

    <small
      class="text-danger"
      *ngIf="
        submitted &&
        loginForm.controls['email'].errors
      "
    >

      Valid email is required

    </small>

  </div>

  <div class="form-group">

    <label>Password</label>

    <input
      type="password"
      class="form-control"
      placeholder="Enter password"
      formControlName="password"
    />

    <small
      class="text-danger"
      *ngIf="
        submitted &&
        loginForm.controls['password'].errors
      "
    >

      Password minimum 6 characters

    </small>

  </div>

  <button
    type="button"
    class="login-btn"
    (click)="submit()"
  >

    Login

  </button>

</form>

    </div>

  </div>

</div>
