<div class="modal-overlay">

    <div class="modal-container">

        <!-- HEADER -->

        <div class="modal-header">

            <div>

                <h3>
                    Create Problem
                </h3>

                <p>
                    Create a root cause record
                </p>

            </div>

            <button class="close-btn" (click)="closeModal()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <!-- FORM -->

        <form [formGroup]="form" class="problem-form">

            <div class="form-grid">

                <div class="form-group full-width">

                    <label>
                        Problem Title
                    </label>

                    <input type="text" formControlName="title" />

                </div>

                <div class="form-group">

                    <label>
                        Priority
                    </label>

                    <select formControlName="priority">

                        <option value="">
                            Select Priority
                        </option>

                        <option>
                            Low
                        </option>

                        <option>
                            Medium
                        </option>

                        <option>
                            High
                        </option>

                        <option>
                            Critical
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Assigned To
                    </label>

                    <input type="text" formControlName="assignedTo" />

                </div>
                <div class="form-group full-width">

                    <label>
                        Linked Incidents
                    </label>

                    <select multiple formControlName="linkedIncidents">

                        @for(

                        incident of
                        incidentService
                        .incidents();

                        track incident.id

                        ) {

                        <option [value]="incident.ticketId">

                            {{ incident.ticketId }}
                            -
                            {{ incident.title }}

                        </option>

                        }

                    </select>

                </div>
                <div class="form-group full-width">

                    <label>
                        Description
                    </label>

                    <textarea rows="2" formControlName="description"></textarea>

                </div>

                <div class="form-group full-width">

                    <label>
                        Root Cause
                    </label>

                    <textarea rows="2" formControlName="rootCause"></textarea>

                </div>

                <div class="form-group full-width">

                    <label>
                        Workaround
                    </label>

                    <textarea rows="2" formControlName="workaround"></textarea>

                </div>

            </div>

            <!-- FOOTER -->

            <div class="modal-footer">

                <button type="button" class="cancel-btn" (click)="closeModal()">

                    Cancel

                </button>

                <button type="button" class="submit-btn" (click)="submit()">

                    Create Problem

                </button>

            </div>

        </form>

    </div>

</div>
