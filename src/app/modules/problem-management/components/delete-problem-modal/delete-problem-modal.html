<div class="modal-overlay" (click)="closeModal()">

  <div class="delete-modal" (click)="$event.stopPropagation()">

    <div class="delete-icon">

      <i class="bi bi-trash"></i>

    </div>

    <h3>
      Delete Problem?
    </h3>

    <p>

      This action cannot
      be undone.

    </p>

    <div class="modal-actions">

      <button
        class="cancel-btn"

        (click)="closeModal()"
      >

        Cancel

      </button>

      <button
        class="delete-btn"

        (click)="confirmDelete()"
      >

        Delete

      </button>

    </div>

  </div>

</div>
