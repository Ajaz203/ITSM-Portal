<div class="modal-overlay">

  <div class="modal-container">

    <!-- HEADER -->

    <div class="modal-header">

      <h2>
        Create Request
      </h2>

      <button
        class="close-btn"

        (click)="
          closeModal()
        "
      >

        <i class="bi bi-x-lg"></i>

      </button>

    </div>

    <!-- FORM -->

    <form

      [formGroup]="
        requestForm
      "

      (ngSubmit)="
        createRequest()
      "
    >

      <!-- TITLE -->

      <div class="form-group">

        <label>
          Title
        </label>

        <input

          type="text"

          formControlName="title"

          placeholder="Enter request title"
        />

      </div>

      <!-- DESCRIPTION -->

      <div class="form-group">

        <label>
          Description
        </label>

        <textarea

          rows="4"

          formControlName="description"

          placeholder="Enter request description"
        ></textarea>

      </div>

      <!-- CATEGORY -->

      <div class="form-group">

        <label>
          Category
        </label>

        <select
          formControlName="category"
        >

          <option value="">
            Select Category
          </option>

          <option value="Hardware">
            Hardware
          </option>

          <option value="Software">
            Software
          </option>

          <option value="Access">
            Access
          </option>

          <option value="Network">
            Network
          </option>

        </select>

      </div>

      <!-- PRIORITY -->

      <div class="form-group">

        <label>
          Priority
        </label>

        <select
          formControlName="priority"
        >

          <option value="Low">
            Low
          </option>

          <option value="Medium">
            Medium
          </option>

          <option value="High">
            High
          </option>

        </select>

      </div>

      <!-- REQUESTED -->

      <div class="form-group">

        <label>
          Requested By
        </label>

        <input

          type="text"

          formControlName="requestedBy"

          placeholder="Enter requester name"
        />

      </div>

      <!-- ACTIONS -->

      <div class="modal-actions">

        <button

          type="button"

          class="cancel-btn"

          (click)="
            closeModal()
          "
        >

          Cancel

        </button>

        <button
          type="submit"

          class="submit-btn"
        >

          Create Request

        </button>

      </div>

    </form>

  </div>

</div>
