<div

  class="modal-overlay"

  (click)="closeModal()"
>

  <div

    class="modal-container"

    (click)="$event.stopPropagation()"
  >

    <!-- HEADER -->

    <div class="modal-header">

      <div>

        <h3>Create Incident</h3>

        <p>
          Create a new incident ticket
        </p>

      </div>

      <button class="close-btn" (click)="closeModal()">

        <i class="bi bi-x-lg"></i>

      </button>

    </div>

    <!-- FORM -->

    <form [formGroup]="form" class="incident-form">

      <!-- GRID -->

      <div class="form-grid">

        <!-- TITLE -->

        <div class="form-group full-width">

          <label>
            Incident Title
          </label>

          <input type="text" formControlName="title" placeholder="Enter title" />

        </div>

        <!-- CATEGORY -->

        <div class="form-group">

          <label>
            Category
          </label>

          <select formControlName="category">

            <option value="">
              Select Category
            </option>

            <option>
              Infrastructure
            </option>

            <option>
              Database
            </option>

            <option>
              Application
            </option>

          </select>

        </div>

        <!-- PRIORITY -->

        <div class="form-group">

          <label>
            Priority
          </label>

          <select formControlName="priority">

            <option value="">
              Select Priority
            </option>

            @for(
            item of priorities;
            track item
            ) {

            <option [value]="item">

              {{ item }}

            </option>

            }

          </select>

        </div>
        <div class="form-group">

          <label>
            Affected Asset
          </label>

          <select formControlName="assetId">

            <option value="">
              Select Asset
            </option>

            @for(

            asset of
            assetService
            .assets();

            track asset.id

            ) {

            <option [value]="asset.assetId">

              {{ asset.name }}

            </option>

            }

          </select>

        </div>
        <!-- ASSIGNED -->

        <div class="form-group">

          <label>
            Assigned To
          </label>

          <input type="text" formControlName="assignedTo" placeholder="Assign user" />

        </div>

        <!-- DESCRIPTION -->

        <div class="form-group full-width">

          <label>
            Description
          </label>

          <textarea rows="3" formControlName="description" placeholder="Describe issue"></textarea>

        </div>

      </div>

      <!-- FOOTER -->

      <div class="modal-footer">

        <button type="button" class="cancel-btn" (click)="closeModal()">

          Cancel

        </button>

        <button type="button" class="submit-btn" (click)="submit()">

          Create Incident

        </button>

      </div>

    </form>

  </div>

</div>
