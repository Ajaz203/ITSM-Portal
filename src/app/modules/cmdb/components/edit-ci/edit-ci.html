<div class="modal-overlay">

  <div class="modal-container">

    <!-- HEADER -->

    <div class="modal-header">

      <div>

        <h3>
          Edit Configuration Item
        </h3>

        <p>
          Update infrastructure
          details
        </p>

      </div>

      <button
        class="close-btn"
        (click)="closeModal()"
      >

        <i class="bi bi-x-lg"></i>

      </button>

    </div>

    <!-- FORM -->

    <form
      [formGroup]="form"
    >

      <div class="form-grid">

        <!-- NAME -->

        <div class="form-group full-width">

          <label>
            CI Name
          </label>

          <input
            type="text"
            formControlName="name"
          />

        </div>

        <!-- TYPE -->

        <div class="form-group">

          <label>
            CI Type
          </label>

          <select
            formControlName="type"
          >

            <option>
              Server
            </option>

            <option>
              Application
            </option>

            <option>
              Database
            </option>

            <option>
              Network
            </option>

            <option>
              Cloud
            </option>

            <option>
              Service
            </option>

          </select>

        </div>

        <!-- STATUS -->

        <div class="form-group">

          <label>
            Status
          </label>

          <select
            formControlName="status"
          >

            <option>
              Operational
            </option>

            <option>
              Warning
            </option>

            <option>
              Critical
            </option>

            <option>
              Offline
            </option>

          </select>

        </div>

        <!-- ENVIRONMENT -->

        <div class="form-group">

          <label>
            Environment
          </label>

          <select
            formControlName="environment"
          >

            <option>
              Production
            </option>

            <option>
              Staging
            </option>

            <option>
              Development
            </option>

          </select>

        </div>

        <!-- OWNER -->

        <div class="form-group">

          <label>
            Owner
          </label>

          <input
            type="text"
            formControlName="owner"
          />

        </div>

        <!-- VENDOR -->

        <div class="form-group">

          <label>
            Vendor
          </label>

          <input
            type="text"
            formControlName="vendor"
          />

        </div>

        <!-- IP -->

        <div class="form-group">

          <label>
            IP Address
          </label>

          <input
            type="text"
            formControlName="ipAddress"
          />

        </div>

        <!-- OS -->

        <div class="form-group">

          <label>
            Operating System
          </label>

          <input
            type="text"
            formControlName="operatingSystem"
          />

        </div>

        <!-- RELATIONSHIPS -->

        <div class="form-group full-width">

          <label>
            Relationships
          </label>

          <textarea

            rows="3"

            formControlName="relationships"

          ></textarea>

        </div>

      </div>

      <!-- FOOTER -->

      <div class="modal-footer">

        <button
          type="button"
          class="cancel-btn"
          (click)="closeModal()"
        >

          Cancel

        </button>

        <button
          type="button"
          class="submit-btn"
          (click)="updateCI()"
        >

          Update CI

        </button>

      </div>

    </form>

  </div>

</div>
