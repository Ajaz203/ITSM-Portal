<div class="header">

  <!-- LEFT -->

  <div class="left-section">

    <button class="menu-btn" (click)="layoutService.toggleSidebar()">

      <i class="bi bi-list"></i>

    </button>

    <h3>
      Dashboard
    </h3>

  </div>

  <!-- RIGHT -->

  <div class="right-section">



    <div class="search-box">

      <i class="bi bi-search"></i>

      <input type="text" placeholder="Search..." />

    </div>

    <!-- NOTIFICATIONS -->

    <div class="notification-wrapper">

      <!-- BELL -->

      <button class="notification-btn" (click)="
      notification
        .toggleNotifications()
    ">

        <i class="bi bi-bell"></i>

        @if(
        notification
        .unreadCount() > 0
        ) {

        <span class="notification-count">

          {{
          notification
          .unreadCount()
          }}

        </span>

        }

      </button>

      <!-- DROPDOWN -->

      @if(
      notification
      .showNotifications()
      ) {

      <div class="notification-dropdown">

        <!-- HEADER -->

        <div class="dropdown-header">

          <h4>
            Notifications
          </h4>

        </div>

        <!-- LIST -->

        <div class="notification-list">

          @for(

          item of

          notification
          .notifications();

          track item.id

          ) {

          <div class="notification-item" [class.unread]="
              !item.read
            " (click)="
              notification
                .markAsRead(item.id)
            ">

            <!-- ICON -->

            <div class="notification-icon" [class.warning]="
                item.type === 'warning'
              " [class.success]="
                item.type === 'success'
              " [class.danger]="
                item.type === 'danger'
              ">

              <i class="bi bi-bell"></i>

            </div>

            <!-- CONTENT -->

            <div class="notification-content">

              <h5>

                {{ item.title }}

              </h5>

              <p>

                {{ item.message }}

              </p>

              <span>

                {{ item.createdAt }}

              </span>

            </div>

          </div>

          }

        </div>

      </div>

      }

    </div>

  <!-- PROFILE WRAPPER -->

<div class="profile-wrapper">

  <!-- PROFILE CARD -->

  <div

    class="profile-card"

    (click)="
      toggleProfileMenu($event)
    "
  >

    <!-- IMAGE -->

    <img

      class="profile-image"

      [src]="
        auth.currentUser()
          ?.image
      "

      alt="profile"

    />

    <!-- INFO -->

    <div class="profile-info">

      <h5>

        {{

          auth.currentUser()
            ?.fullName

        }}

      </h5>

      <p>

        {{

          auth.currentUser()
            ?.role

        }}

      </p>

    </div>

    <!-- ICON -->

    <i class="bi bi-chevron-down"></i>

  </div>

  <!-- DROPDOWN -->

  @if(showProfileMenu) {

  <div

    class="profile-dropdown"

    (click)="$event.stopPropagation()"
  >

    <!-- PROFILE -->

    <button class="dropdown-item">

      <div class="item-icon blue">

        <i class="bi bi-person"></i>

      </div>

      <div class="item-content">

        <h6>
          My Profile
        </h6>

        <span>
          View profile details
        </span>

      </div>

    </button>

    <!-- SETTINGS -->

    <button class="dropdown-item">

      <div class="item-icon purple">

        <i class="bi bi-gear"></i>

      </div>

      <div class="item-content">

        <h6>
          Settings
        </h6>

        <span>
          Manage preferences
        </span>

      </div>

    </button>

    <!-- DIVIDER -->

    <div class="dropdown-divider"></div>

    <!-- LOGOUT -->

    <button

      class="dropdown-item logout-item"

      (click)="logout()"
    >

      <div class="item-icon red">

        <i class="bi bi-box-arrow-right"></i>

      </div>

      <div class="item-content">

        <h6>
          Logout
        </h6>

        <span>
          Sign out from account
        </span>

      </div>

    </button>

  </div>

  }

</div>
  </div>

</div>
